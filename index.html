
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Ledger Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Gold Ledger">
    <meta name="mobile-web-app-capable" content="yes">
    
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #1a1a1a; --text: #fff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .page { display: none; } .active { display: block; }
        .card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid var(--gold); cursor: pointer; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 10px; box-sizing: border-box; }
        .btn { background: var(--gold); border: none; padding: 12px; border-radius: 10px; cursor: pointer; color: #000; font-weight: bold; width: 100%; margin-top: 10px; }
        .fab { position: fixed; bottom: 30px; right: 30px; background: var(--gold); width: 60px; height: 60px; border-radius: 50%; font-size: 30px; text-align: center; line-height: 60px; color: #000; cursor: pointer; box-shadow: 0 4px 10px rgba(212,175,55,0.4); }
        h1 { color: var(--gold); text-align: center; cursor: pointer; }
    </style>
</head>
<body>

<div id="lockPage" class="page active">
    <h1>🪙 Gold Ledger</h1>
    <input type="password" id="mainPass" placeholder="Enter Password">
    <button class="btn" onclick="checkLock()">Unlock App</button>
</div>

<div id="homePage" class="page">
    <h1 onclick="adminTap()">🪙 Gold</h1>
    <input type="text" id="searchInput" placeholder="Search by Date or Amount..." oninput="render()">
    <div id="ticketList"></div>
    <div class="fab" onclick="showPage('formPage')">+</div>
</div>

<div id="formPage" class="page">
    <h2>Add New Ticket</h2>
    <input type="date" id="tDate">
    <input type="number" id="tGrams" placeholder="Gold Weight (Grams)">
    <input type="number" id="tAmount" placeholder="Principal Amount">
    <button class="btn" onclick="saveTicket()">Save Ticket</button>
    <button class="btn" style="background:#444; color:#fff" onclick="showPage('homePage')">Cancel</button>
</div>

<div id="detailsPage" class="page">
    <h2>Ticket Details</h2>
    <div id="detailsContent" class="card"></div>
    <button class="btn" style="background:#800; color:#fff" onclick="deleteTicket()">Delete Ticket</button>
    <button class="btn" onclick="showPage('homePage')">Back</button>
</div>

<script>
    let tickets = JSON.parse(localStorage.getItem('tickets')) || [];
    let currentIdx = null;
    let tapCount = 0;

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'homePage') render();
    }

    function checkLock() {
        if(document.getElementById('mainPass').value === '19Feb1967') showPage('homePage');
        else alert('Wrong Password');
    }

    function saveTicket() {
        tickets.push({ 
            date: document.getElementById('tDate').value, 
            grams: document.getElementById('tGrams').value, 
            principal: parseFloat(document.getElementById('tAmount').value)
        });
        localStorage.setItem('tickets', JSON.stringify(tickets));
        showPage('homePage');
    }

    function openDetails(idx) {
        currentIdx = idx;
        let t = tickets[idx];
        let startDate = new Date(t.date);
        let now = new Date();
        let displayDate = now.getDate() + '-' + (now.getMonth() + 1) + '-' + now.getFullYear();
        
        let diffInMs = now - startDate;
        let totalDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));
        
        let years = Math.floor(totalDays / 365);
        let remainingDays = totalDays % 365;
        let months = Math.floor(remainingDays / 30);
        let days = remainingDays % 30;

        let balance = parseFloat(t.principal);
        for(let i = 0; i < years; i++) balance += (balance * 0.18);
        balance += (balance * (0.015 * months));
        balance += (balance * ((0.015 / 30) * days));
        
        document.getElementById('detailsContent').innerHTML = 
            `<p><strong>Ticket Date:</strong> ${t.date}</p>
             <p><strong>Calculation Date:</strong> ${displayDate}</p>
             <p><strong>Gold Weight:</strong> ${t.grams} Grams</p>
             <p><strong>Principal:</strong> ₹${t.principal}</p>
             <p><strong>Time:</strong> ${years}y, ${months}m, ${days}d</p>
             <p><strong>Interest:</strong> ₹${(balance - t.principal).toFixed(2)}</p>
             <h3>Total Payable: ₹${balance.toFixed(2)}</h3>`;
        showPage('detailsPage');
    }

    function render() {
        let q = document.getElementById('searchInput').value.toLowerCase();
        let filtered = tickets.filter(t => t.date.includes(q) || t.principal.toString().includes(q));
        document.getElementById('ticketList').innerHTML = filtered.map((t, idx) => 
            `<div class='card' onclick="openDetails(${tickets.indexOf(t)})">
                Date: ${t.date} | Gold: ${t.grams}g | ₹${t.principal}
             </div>`
        ).join('');
    }

    function deleteTicket() {
        if(confirm("Delete this ticket?")) {
            tickets.splice(currentIdx, 1);
            localStorage.setItem('tickets', JSON.stringify(tickets));
            showPage('homePage');
        }
    }

    function adminTap() {
        tapCount++;
        if(tapCount >= 5) {
            let pass = prompt("Admin Password:");
            if(pass === 'ashokkumar1967') {
                let totalGrams = 0;
                let totalPrincipal = 0;
                let totalInterest = 0;
                let now = new Date();

                tickets.forEach(t => {
                    let startDate = new Date(t.date);
                    let diffInMs = now - startDate;
                    let totalDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));
                    
                    let years = Math.floor(totalDays / 365);
                    let remainingDays = totalDays % 365;
                    let months = Math.floor(remainingDays / 30);
                    let days = remainingDays % 30;

                    let balance = parseFloat(t.principal);
                    for(let i = 0; i < years; i++) balance += (balance * 0.18);
                    balance += (balance * (0.015 * months));
                    balance += (balance * ((0.015 / 30) * days));
                    
                    totalGrams += parseFloat(t.grams || 0);
                    totalPrincipal += parseFloat(t.principal || 0);
                    totalInterest += (balance - parseFloat(t.principal));
                });

                alert("--- Ledger Summary ---\n" +
                      "Total Tickets: " + tickets.length + "\n" +
                      "Total Gold: " + totalGrams.toFixed(2) + " Grams\n" +
                      "Total Principal: ₹" + totalPrincipal.toLocaleString('en-IN') + "\n" +
                      "Total Interest: ₹" + totalInterest.toFixed(2));
            }
            tapCount = 0;
        }
    }
    render();
</script>
</body>
</html>
